<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Post</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header class="header">

        <div class="container">

            <h1>Meu Blog</h1>

            <nav>
                <a href="/">Início</a>
                <a href="#">Sobre</a>
                <a href="#">Contato</a>
            </nav>

        </div>

    </header>


    <main class="container">

        <article class="post">

            <h2>{{ post["title"] }}</h2>

            <p>
                {{ post["content"] }}
            </p>
            
            <a href="{{ url_for('edit_post', id=post['id']) }}">
                Editar post
            </a>

            <form method="POST" action="{{ url_for('delete_post', id=post['id']) }}">
                
                <button type="submit">
                    Excluir post
                </button>

            </form>

            <a href="/">
                ← Voltar para os posts
            </a>

        </article>

    </main>


    <footer class="footer">

        <p>© 2026 Meu Blog</p>

    </footer>

</body>

</html>
